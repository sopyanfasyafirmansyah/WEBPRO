
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Profil Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Form Profil Mahasiswa</h1>

        <form id="formProfil">

            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama">
            <span id="errorNama" class="error"></span>

            <label for="email">Email:</label>
            <input type="text" id="email" name="email">
            <span id="errorEmail" class="error"></span>

            <label for="alamat">Alamat:</label>
            <textarea id="alamat" name="alamat"></textarea>
            <span id="errorAlamat" class="error"></span>

            <button type="submit">Kirim</button>

        </form>

        <p id="pesanSukses" class="success"></p>
    </div>

    <script src="jurnal.js"></script>

</body>
</html>



 <!-- Script Fungsi Pemrosesan Pesanan -->
    <script>
        function prosesPesanan(event) {
            // Mencegah formulir dari reload/refresh halaman
            event.preventDefault();

            // Mengambil nilai dari form input
            const nama = document.getElementById('namaPembeli').value;
            const meja = document.getElementById('nomorMeja').value;
            const pesanan = document.getElementById('namaPesanan').value;

            // Mengambil elemen tempat notifikasi
            const notif = document.getElementById('notifPesan');

            // Mengisi pesan notifikasi
            notif.innerHTML = `<strong>Pesanan Berhasil!</strong><br>Terima kasih <b>${nama}</b> (Meja ${meja}), pesanan <b>${pesanan}</b> Anda sedang diproses.`;

            // Menampilkan kotak notifikasi
            notif.style.display = 'block';

            // Mengosongkan form input kembali
            document.getElementById('orderForm').reset();

            // Opsional: Hilangkan notifikasi secara otomatis setelah 6 detik
            setTimeout(() => {
                notif.style.display = 'none';
            }, 6000);
        }
    </script>

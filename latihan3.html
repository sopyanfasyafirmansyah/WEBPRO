
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Mahasiswa</title>
</head>
<body>

    <h2>Form Input Data Mahasiswa</h2>

    <form action="#" method="post">

        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"
               placeholder="Masukkan nama" required>
        <br><br>

        <label for="nim">NIM:</label>
        <input type="text" id="nim" name="nim"
               placeholder="Masukkan NIM" required>
        <br><br>

        <label for="jurusan">Jurusan:</label>
        <select id="jurusan" name="jurusan" required>
            <option value="">-- Pilih Jurusan --</option>
            <option value="TI">Teknik Informatika</option>
            <option value="SI">Sistem Informasi</option>
            <option value="TK">Teknik Komputer</option>
        </select>
        <br><br>

        <label>Hobi:</label>
        <br>

        <input type="checkbox" id="membaca"
               name="hobi" value="Membaca">
        <label for="membaca">Membaca</label>
        <br>

        <input type="checkbox" id="olahraga"
               name="hobi" value="Olahraga">
        <label for="olahraga">Olahraga</label>
        <br>

        <input type="checkbox" id="bersepeda"
               name="hobi" value="Bersepeda">
        <label for="bersepeda">Bersepeda</label>
        <br><br>

        <input type="submit" value="sumbit">


    </form>

</body>
</html>
